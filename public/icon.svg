    <rect x="96" y="96" width="36" height="24" rx="4"/>
    <rect x="140" y="96" width="36" height="24" rx="4"/>
    <rect x="184" y="96" width="36" height="24" rx="4"/>
    <rect x="292" y="96" width="36" height="24" rx="4"/>
    <rect x="336" y="96" width="36" height="24" rx="4"/>
    <rect x="380" y="96" width="36" height="24" rx="4"/>

    <rect x="96" y="128" width="36" height="24" rx="4"/>
    <rect x="380" y="128" width="36" height="24" rx="4"/>
  </g>
  
  <!-- Yellow heart pixel art in center -->
