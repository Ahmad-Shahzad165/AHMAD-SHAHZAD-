  <!-- Glowing Orange-Red Paddle -->
  <rect x="156" y="416" width="200" height="22" rx="11" fill="#ff4500" stroke="#ffaa00" stroke-width="4" filter="drop-shadow(0 0 16px #ff4500)"/>
